<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Drop | Secure Share</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Dead Drop</h1>
            <textarea id="secretInput" placeholder="Paste your secret/password/keys here..."></textarea>

            <label for="fileInput">Attachment (Optional):</label>
            <input type="file" id="fileInput">

            <label for="ttlSelect">Self-Destruct Timer:</label>
            <select id="ttlSelect">
                <option value="1h">1 Hour</option>
                <option value="24h">24 Hours</option>
                <option value="7d">7 Days</option>
            </select>
            <button id="createBtn" onclick="createSecret()">Encrypt & Share</button>
            <div id="result" class="secret-view" style="display:none; text-align: center;"></div>
        </div>
    </div>

    <script>
        async function createSecret() {
            const secret = document.getElementById('secretInput').value;
            if (!secret) return;

            const btn = document.getElementById('createBtn');
            btn.innerText = "Encrypting...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/secret', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret: secret })
                });

                if (response.ok) {
                    const data = await response.json();
                    const link = window.location.origin + "/secret/" + data.id;

                    document.getElementById('secretInput').style.display = 'none';
                    btn.style.display = 'none';

                    const resultDiv = document.getElementById('result');
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <p style="color:#aaa">Secret Link (One-time use):</p>
                        <a href="${link}" style="color:var(--accent-color); font-size:1.2em;">${link}</a>
                        <p class="burn-notice">This link will self-destruct after reading.</p>
                    `;
                } else {
                    alert("System Error. Connection Terminated.");
                    btn.innerText = "Encrypt & Share";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                alert("Network Error.");
                btn.innerText = "Encrypt & Share";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
