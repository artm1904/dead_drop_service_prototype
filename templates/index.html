<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Drop Service</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        #result { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 4px; display: none; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Dead Drop Service</h1>
    <p>Create a one-time secret message. It will be deleted after being viewed once.</p>
    
    <textarea id="secretText" placeholder="Enter your secret here..."></textarea>
    <button onclick="createSecret()">Create Secret</button>

    <div id="result">
        <p>Secret link (copy this):</p>
        <code id="secretLink"></code>
    </div>

    <script>
        async function createSecret() {
            const text = document.getElementById('secretText').value;
            if (!text) return;

            try {
                const response = await fetch('/api/secret', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret: text })
                });

                if (response.ok) {
                    const data = await response.json();
                    const link = `${window.location.protocol}//${window.location.host}/secret/${data.id}`;
                    document.getElementById('secretLink').textContent = link;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('Error creating secret');
                }
            } catch (e) {
                console.error(e);
                alert('Network error');
            }
        }
    </script>
</body>
</html>
