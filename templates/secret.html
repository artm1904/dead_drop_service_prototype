<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр сообщения</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --danger-border: #fecaca;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .warning {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .warning svg {
            margin-right: 0.75rem;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .label {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .content-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            /* Сохраняет переносы строк */
            font-family: monospace;
            /* Для кода/секретов часто удобнее */
            font-size: 1rem;
            color: #334155;
            margin-bottom: 1.5rem;
            word-break: break-word;
            position: relative;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            flex: 1;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-color);
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Сообщение получено</h1>

        <div class="warning">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>Внимание: Это сообщение было удалено с сервера. Вы видите его в последний раз. Сохраните его
                сейчас.</span>
        </div>

        <div class="label">Текст сообщения:</div>
        <div class="content-box" id="secretContent">{{secret_content}}</div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="copyText()">Копировать текст</button>
            <a href="/" class="btn">Создать новое</a>
        </div>
    </div>

    <script>
        function copyText() {
            const text = document.getElementById('secretContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-secondary');
                const originalText = btn.innerText;
                btn.innerText = 'Скопировано!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
                alert('Ошибка при копировании. Пожалуйста, скопируйте вручную.');
            });
        }
    </script>

</body>

</html>
