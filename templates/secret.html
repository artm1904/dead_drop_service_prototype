<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Secret</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .warning {
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 1rem;
            border: 1px solid #d9534f;
            padding: 1rem;
            border-radius: 4px;
        }

        .content {
            background: #f9f9f9;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>Secret Message</h1>

    <div class="warning">
        This message has been deleted from the server. You can only see it this one time.
    </div>

    <div class="content">{{secret_content}}</div>

    <p><a href="/">Create another secret</a></p>
</body>

</html>
